# Remora's guest (bd remora-7oih.5): one account, key only, and only the host key the Windows app
# handed in through fw_cfg (see /etc/init.d/remora-guest), so the client can pin it.
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers remora
UseDNS no
