name: Release

# Runs on a version tag (v*). Checks the tag against every place the version is written, builds the
# source tarball with `git archive`, the .deb with CPack, the Windows installer with NSIS, a
# native FreeBSD package and the phone app's APK, signed with the release key. It stamps the tarball checksum into a copy of the PKGBUILD, renders the
# Gentoo ebuild, generates an SBOM,
# attests provenance for what this run built, and publishes the GitHub release with CHANGELOG.md's
# section for the version as its notes.
#
# Nothing is committed back. The PKGBUILD in the tree keeps sha256sums=('SKIP') and the release
# carries the stamped copy, so a tag never needs a follow-up bot commit on main.
#
# To cut a release: tools/bump-version.sh <YYYY.MM.PATCH>, write the CHANGELOG section, commit,
# then push the tag v<YYYY.MM.PATCH>.

on:
  push:
    tags:
      - 'v*'

# Read-only by default; the one job that publishes opts in to what it needs, so a job added here
# later does not silently inherit write access to the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Windows installer, built exactly as windows.yml builds it on every push to main, and handed
  # to the release job below, which attests and publishes it with everything else: one publishing
  # path.
  windows:
    name: Windows installer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<YYYY.MM.PATCH>"
            exit 1
          fi
          echo "installer=Remora-$VERSION-windows-x64-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build p7zip-full libarchive-tools curl nsis

      - name: Cache the Windows SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/remora-windows-sdk
          key: windows-sdk-${{ hashFiles('tools/windows-sdk.sh') }}

      - name: Fetch the Windows SDK
        run: tools/windows-sdk.sh

      - name: Cache the guest kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/remora-guest-build/kernel-*
          key: guest-kernel-${{ hashFiles('guest/kernel/config', 'guest/assemble.sh') }}

      - name: Build the guest
        run: guest/build.sh build-guest

      - name: Configure
        run: >
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/windows-llvm-mingw.cmake

      - name: Build
        run: cmake --build build-win

      - name: Stage and package
        env:
          INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          set -euo pipefail
          tools/windows-stage.sh build-win dist build-guest
          tools/windows-installer.sh dist "$INSTALLER"
          sha256sum "$INSTALLER" | tee "$INSTALLER.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            ${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.installer }}.sha256
          retention-days: 1
          if-no-files-found: error

  freebsd:
    name: FreeBSD 15 amd64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These two static Linux binaries are copied to the Docker host by the remote deployer.
      - name: Build the Android container helpers on Linux
        run: make -C vendor/native -j2

      - name: Build, install and smoke-test on FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '15.1'
          arch: x86_64
          prepare: |
            pkg install -y cmake-core ninja pkgconf qt6-base qt6-multimedia qt6-webengine \
              qt6-base_sqldriver-sqlite qt6-svg ffmpeg ffnvcodec-headers gmake python3 \
              android-tools git xorg-vfbserver xdotool
          run: |
            set -eu
            export LC_ALL=C.UTF-8
            version=$(cat VERSION)
            asset="Remora-$version-freebsd15-amd64.pkg"
            build=$(mktemp -d)
            trap 'rm -rf "$build"' EXIT
            cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DREMORA_INSTALLED_VENDOR=ON -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_REQUIRE_FIND_PACKAGE_Python3=ON
            cmake --build "$build" --parallel 2
            python3 tools/freebsd-package.py "$build"
            pkg install -y "./dist/$asset"
            pkg check -ds remora
            # Engine tests need the vendor tree at the compiled-in installation path.
            ctest --test-dir "$build" --output-on-failure
            install -m 0555 tools/freebsd-installed-smoke.sh "$build/installed-smoke.sh"
            chmod 755 "$build"
            su -m nobody -c "sh '$build/installed-smoke.sh' '$version'"
            (cd dist && sha256 -r "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-package
          path: dist/*-freebsd15-amd64.pkg*
          retention-days: 1
          if-no-files-found: error

  # The phone app, built from the SDK this runner carries and signed with the release key, the one
  # place that key is used. Its certificate is checked against phone/release-cert.sha256, so a
  # wrong or rotated secret fails the release instead of shipping an APK no installed copy accepts
  # as an update. The key reaches only this job, and only on a tag.
  phone:
    name: Phone app APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<YYYY.MM.PATCH>"
            exit 1
          fi
          echo "apk=Remora-$VERSION-android-phone.apk" >> "$GITHUB_OUTPUT"

      # The two packages phone/build.sh needs, by name: a no-op when the image has them already, and
      # a newer image cannot change what the app is built with.
      - name: Android SDK packages
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.REMORA_PHONE_KEYSTORE }}
          REMORA_PHONE_KEYSTORE_PASSWORD: ${{ secrets.REMORA_PHONE_KEYSTORE_PASSWORD }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$REMORA_PHONE_KEYSTORE_PASSWORD" ]; then
            echo "::error::the REMORA_PHONE_KEYSTORE and REMORA_PHONE_KEYSTORE_PASSWORD secrets are not set"
            exit 1
          fi
          export REMORA_PHONE_KEYSTORE="$RUNNER_TEMP/phone-release.p12"
          base64 -d <<<"$KEYSTORE_BASE64" > "$REMORA_PHONE_KEYSTORE"
          trap 'rm -f "$REMORA_PHONE_KEYSTORE"' EXIT
          PATH="$JAVA_HOME_17_X64/bin:$PATH" phone/build.sh "$ANDROID_HOME"
          mv phone/out/remora-phone.apk "$APK"

      - name: Check the signing certificate
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          certs=$("$JAVA_HOME_17_X64/bin/java" -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" \
            verify --print-certs "$APK")
          echo "$certs"
          got=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$certs")
          want=$(tr -d '[:space:]' < phone/release-cert.sha256)
          if [ "$got" != "$want" ] || grep -q '^Signer #2' <<<"$certs"; then
            echo "::error file=phone/release-cert.sha256::the APK is signed by '$got', the release key is '$want'"
            exit 1
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-apk
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish Linux, Windows, FreeBSD and phone release assets
    needs: [windows, freebsd, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # contents: write creates the release and uploads its assets. id-token: write mints the
    # short-lived OIDC token that proves to Sigstore which workflow, at which commit, produced these
    # bytes; attestations: write stores the resulting attestation against the repository. Neither of
    # the last two grants write access to the repository itself.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the only input here a person typed, so it is checked against the version format
      # before anything else uses it — every later step can then interpolate it safely.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not v<YYYY.MM.PATCH>"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tarball=Remora-$VERSION.tar.gz"
            echo "sbom=Remora-$VERSION-linux-x64.cdx.json"
            echo "ebuild=remora-$VERSION.ebuild"
            echo "installer=Remora-$VERSION-windows-x64-setup.exe"
            echo "freebsd=Remora-$VERSION-freebsd15-amd64.pkg"
            echo "apk=Remora-$VERSION-android-phone.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches every version in the tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
          METAINFO: packaging/io.github.EtherAura.Remora.metainfo.xml
        run: |
          set -euo pipefail
          fail=0
          err() { echo "::error file=$1::$2"; fail=1; }

          # VERSION is the single source: CMakeLists.txt reads it for project() and CPack, so
          # checking it is checking the .deb's version too.
          v=$(tr -d '[:space:]' < VERSION)
          [ "$v" = "$VERSION" ] || err VERSION "VERSION holds '$v', the tag is v$VERSION"

          v=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          [ "$v" = "$VERSION" ] || err packaging/PKGBUILD "pkgver is '$v', expected '$VERSION'"

          # The metainfo's FIRST <release> is the newest — what software centres show.
          mi=$(python3 -c 'import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot().find("releases/release")
          print("" if r is None else r.get("version", ""), "" if r is None else r.get("date", ""))' "$METAINFO")
          mi_version=${mi% *}
          mi_date=${mi#* }
          [ "$mi_version" = "$VERSION" ] \
            || err "$METAINFO" "the newest <release> is '$mi_version', expected '$VERSION'"
          # The date need not be the tag's day (bumping a few days early is normal), but it must be
          # a real calendar date and not in the future: software centres show it, and appstreamcli
          # warns on a bad one.
          if ! [[ "$mi_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            err "$METAINFO" "the newest <release> has no date=\"YYYY-MM-DD\" (got '$mi_date')"
          elif ! rel_epoch=$(date -u -d "$mi_date" +%s 2>/dev/null); then
            err "$METAINFO" "the newest <release> date '$mi_date' is not a calendar date"
          elif [ "$rel_epoch" -gt "$(date -u +%s)" ]; then
            err "$METAINFO" "the newest <release> date '$mi_date' is in the future (today UTC is $(date -u +%Y-%m-%d))"
          fi

          # CHANGELOG.md: the section the release notes come from, dated as the metainfo is —
          # tools/bump-version.sh writes both on the same day, so a mismatch is a hand edit gone astray.
          heading=$(grep -m1 -E "^## \[${VERSION//./\\.}\]" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            err CHANGELOG.md "no '## [$VERSION] - <date>' section"
          else
            cl_date=$(printf '%s\n' "$heading" | sed -n -E 's/^## \[[^]]+\] - ([0-9]{4}-[0-9]{2}-[0-9]{2})$/\1/p')
            [ "$cl_date" = "$mi_date" ] \
              || err CHANGELOG.md "'$heading' — expected '## [$VERSION] - $mi_date', the metainfo's date"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::v$VERSION does not match the version metadata. Fix the files above (tools/bump-version.sh writes them all) and re-tag."
            exit 1
          fi
          echo "All version metadata agrees on v$VERSION"

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" CHANGELOG.md release-notes.md <<'PY'
          import re
          import sys

          version, src, dst = sys.argv[1:]
          head = re.compile(r"^## \[" + re.escape(version) + r"\]")
          found, out = False, []
          with open(src, encoding="utf-8") as f:
              for line in f.read().splitlines():
                  if not found:
                      found = bool(head.match(line))
                      continue
                  # The section ends at the next release heading or at the link definitions.
                  if line.startswith("## ") or re.match(r"^\[[^\]]+\]: ", line):
                      break
                  out.append(line)
          body = "\n".join(out).strip()
          if not found:
              print(f"::error file=CHANGELOG.md::no '## [{version}]' section to publish as the release notes")
              sys.exit(1)
          if not body:
              print(f"::error file=CHANGELOG.md::the '## [{version}]' section is empty — write the release notes")
              sys.exit(1)
          with open(dst, "w", encoding="utf-8") as f:
              f.write(body + "\n")
          PY
          cat release-notes.md

      - name: Create the source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="Remora-$VERSION/" -o "$TARBALL" HEAD
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"

      # The PKGBUILD's source= is this release's tarball asset, whose sum only exists now. The copy
      # attached to the release carries it; the tree's copy stays 'SKIP'.
      - name: Stamp the tarball's sha256 into the release PKGBUILD
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 "$TARBALL.sha256")
          sed -E "s/^sha256sums=\('SKIP'\)$/sha256sums=('$sha')/" packaging/PKGBUILD > PKGBUILD
          if ! grep -qx "sha256sums=('$sha')" PKGBUILD; then
            echo "::error file=packaging/PKGBUILD::expected a sha256sums=('SKIP') line to stamp"
            exit 1
          fi
          # shellcheck disable=SC2016  # the literal ${pkgver} text of the PKGBUILD's source= line
          if ! grep -qF 'releases/download/v${pkgver}/Remora-${pkgver}.tar.gz' PKGBUILD; then
            echo "::error file=packaging/PKGBUILD::source= does not name this release's tarball asset"
            exit 1
          fi
          diff -u packaging/PKGBUILD PKGBUILD || true

      # The ebuild is the template under this release's file name, unchanged: Portage reads ${PV}
      # from the name, so SRC_URI and S follow it, and Gentoo keeps the tarball's sum in the
      # overlay's Manifest, not in the ebuild. The offline test checks the template for this version
      # first: SRC_URI is this release's tarball asset, S its archive prefix, no placeholder is left,
      # and every package the PKGBUILD names has a Gentoo equivalent.
      - name: Render the release ebuild
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EBUILD: ${{ steps.version.outputs.ebuild }}
        run: |
          set -euo pipefail
          bash tools/test-gentoo-ebuild.sh "$VERSION"
          cp packaging/remora.ebuild.in "$EBUILD"

      # The same packages ci.yml builds and tests with.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build extra-cmake-modules \
            qt6-base-dev libqt6sql6-sqlite qt6-multimedia-dev qt6-webengine-dev \
            libgl1-mesa-dev libffmpeg-nvenc-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libva-dev

      # The suites run from a development tree, not from the packaged one below: they read the vendor
      # tree their build was configured against, and the packaged build points at
      # /usr/share/remora/vendor, which only exists once the .deb is installed. ci.yml has tested this
      # commit already; testing it again here means no release is cut from a commit that fails.
      - name: Build and test (development tree)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake -S . -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_REQUIRE_FIND_PACKAGE_Python3=ON
          cmake --build build/test --parallel
          ctest --test-dir build/test --output-on-failure

      # A packaged build: the binary reads its scripts from /usr/share/remora/vendor, not from this
      # checkout. The optional helpers are probed, not required, so the configure transcript is
      # checked for the ones this .deb is meant to carry — a package dropped from the list above
      # then fails the release here instead of shipping a .deb quietly missing a feature. The host
      # encoder is NOT among them: it needs FFmpeg 7, and Ubuntu 24.04 ships 6.1.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DREMORA_INSTALLED_VENDOR=ON \
            2>&1 | tee configure.log
          want="remora-frame-decoder: building"
          if ! grep -qF "$want" configure.log; then
            echo "::error::configure did not report '$want' — the .deb would ship without it. Check the apt list above."
            exit 1
          fi
          grep -F 'remora-frame-encoder:' configure.log | sed 's/^-- /::notice::/'

      - name: Build
        run: cmake --build build/release --parallel

      - name: Package the .deb
        id: deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd build/release && cpack -G DEB)
          built=$(find build/release -maxdepth 1 -name 'remora_*.deb' -print -quit)
          if [ -z "$built" ]; then
            echo "::error::cpack -G DEB produced no .deb under build/release/"
            exit 1
          fi
          # A predictable asset name, so direct-download links follow the same pattern every release.
          deb="remora_${VERSION}_amd64.deb"
          mv "$built" "$deb"
          v=$(dpkg-deb -f "$deb" Version)
          [ "$v" = "$VERSION" ] || { echo "::error::the .deb says Version: $v, expected $VERSION"; exit 1; }
          # fwd is bind-mounted into every container, and nothing builds it after install. The
          # listing is captured first: `dpkg-deb -c | grep -q` under pipefail fails on a MATCH, when
          # grep's early exit kills dpkg-deb with SIGPIPE.
          listing=$(dpkg-deb -c "$deb")
          for f in fwd uinput-kbd remora-frame-decoder; do
            grep -qE "\./usr/share/remora/vendor/native/$f\$" <<<"$listing" \
              || { echo "::error::the .deb is missing /usr/share/remora/vendor/native/$f"; exit 1; }
          done
          dpkg-deb -I "$deb"
          sha256sum "$deb" | tee "$deb.sha256"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      # CycloneDX over the .deb. One scan covers the tarball as well: both are the same source at
      # the same commit, and the .deb is the one carrying resolved dependency data (its Depends and
      # the ELF linkage of what it installs). Both upload switches are off — this workflow publishes
      # through action-gh-release, and a second upload path could disagree about what shipped.
      - name: Generate the SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          file: ${{ steps.deb.outputs.deb }}
          format: cyclonedx-json
          output-file: ${{ steps.version.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      # The Windows job's installer, with the sum it took when it built it, checked again here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer

      - name: Check the Windows installer
        env:
          INSTALLER: ${{ steps.version.outputs.installer }}
        run: sha256sum -c "$INSTALLER.sha256"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd-package

      - name: Check the FreeBSD package checksum
        env:
          FREEBSD_PACKAGE: ${{ steps.version.outputs.freebsd }}
        run: sha256sum -c "$FREEBSD_PACKAGE.sha256"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-apk

      - name: Check the phone app's checksum
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: sha256sum -c "$APK.sha256"

      # A Sigstore-backed record that these exact bytes came from this workflow at this commit:
      #
      #     gh attestation verify remora_<version>_amd64.deb --repo EtherAura/Remora
      #
      # Provenance, not code signing. Only what this run BUILT is attested: the .sha256 files derive
      # from the files beside them, the PKGBUILD is a source file with one line stamped, and the
      # ebuild is a source file renamed. Runs before publishing on purpose — a release without its
      # attestation is a claim with no evidence.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.version.outputs.tarball }}
            ${{ steps.deb.outputs.deb }}
            ${{ steps.version.outputs.sbom }}
            ${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.freebsd }}
            ${{ steps.version.outputs.apk }}

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Remora ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.version.outputs.tarball }}
            ${{ steps.version.outputs.tarball }}.sha256
            ${{ steps.deb.outputs.deb }}
            ${{ steps.deb.outputs.deb }}.sha256
            PKGBUILD
            ${{ steps.version.outputs.ebuild }}
            ${{ steps.version.outputs.sbom }}
            ${{ steps.version.outputs.installer }}
            ${{ steps.version.outputs.installer }}.sha256
            ${{ steps.version.outputs.freebsd }}
            ${{ steps.version.outputs.freebsd }}.sha256
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          fail_on_unmatched_files: true
